<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Compare the CO2 footprint of different foods per weight, calories, and protein. Learn how your food choices impact the environment with Coco the Koala.">
    <title>CoCo's CO2 Food Comparison | Environmental Impact Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Hero Image -->
    <div class="hero-image">
        <img src="assets/coco-koala.png" alt="Coco the Koala" id="cocoImage" onerror="this.style.display='none'">
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1>CoCo - CO2 Comparer</h1>
        </div>
    </header>

    <div class="container">
        <main class="main-content">
            <section class="food-comparison">
                <div class="mode-buttons">
                    <button class="mode-btn active" data-mode="weight">weight</button>
                    <button class="mode-btn" data-mode="calories">calories</button>
                    <button class="mode-btn" data-mode="protein">protein</button>
                </div>

                <div class="category-buttons">
                    <button class="category-btn active" data-category="animal">Animal Products</button>
                    <button class="category-btn active" data-category="plant_protein">Plant Proteins</button>
                    <button class="category-btn active" data-category="grain">Grains</button>
                    <button class="category-btn active" data-category="vegetable">Vegetables</button>
                </div>

                <div class="bar-chart-container">
                    <div id="foodsList" class="foods-bars"></div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Data sources: <a href="#" id="viewSourcesLink">View all scientific sources</a></p>
            <p class="attribution">
                Made with ❤️ by Claude with <span id="tokens"></span>k Tokens
                (~<span id="cost"></span>€ / ~<span id="co2"></span>kg CO2) |
                <a href="https://github.com/Ionenstrahl/CoCo" target="_blank">View on GitHub</a>
            </p>
        </footer>
    </div>

    <!-- Source Modal -->
    <div id="sourceModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>Scientific Source</h2>
            <div id="sourceDetails"></div>
        </div>
    </div>

    <!-- All Sources Modal -->
    <div id="allSourcesModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>All Data Sources</h2>
            <div id="allSourcesDetails"></div>
        </div>
    </div>

    <!-- Load data and main script -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
